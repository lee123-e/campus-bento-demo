spring.application.name=reggie
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=reggie;integratedSecurity=true;encrypt=true;trustServerCertificate=true
management.endpoint.health.show-components=always
server.servlet.session.timeout=${REGGIE_SESSION_TIMEOUT:7d}
server.servlet.session.cookie.max-age=${REGGIE_SESSION_COOKIE_MAX_AGE:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=${REGGIE_PERSIST_SESSIONS:true}
server.servlet.session.store-dir=${REGGIE_SESSION_STORE_DIR:${user.dir}/.local/sessions}
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=5MB
reggie.customer.local-verification=${REGGIE_CUSTOMER_LOCAL_VERIFICATION:false}
reggie.order.demo-payment=${REGGIE_ORDER_DEMO_PAYMENT:false}
